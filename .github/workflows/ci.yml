name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Needs the typecheck-result/lint-result/test-result/test-summary/
  # build-result outputs the pr-comment job below reads — added to
  # tuxery/.github's ci-web.yml by a93f7e5, now on main.
  #
  # This was pinned to the ci/expose-per-job-outputs branch's tip commit
  # from before that PR merged (0e35a38) — real breakage, found live
  # 2026-09-04: that branch commit is unreachable from any ref once the
  # PR merged (squash-merged under a93f7e5, a different SHA), so every
  # run of this workflow since has failed outright before a single job
  # starts (zero jobs, near-instant "failure", on every push/PR to main
  # from 9187841 onward — this repo's CI has been red the whole time).
  # Re-pin to a real branch/tag-reachable SHA, not a feature-branch tip
  # that's about to disappear, next time this needs bumping.
  ci:
    uses: tuxery/.github/.github/workflows/ci-web.yml@a93f7e556b3778cdc3b23bff815b4bba650c7b47 # main @ 2026-09-04
    with:
      working-directory: .

  # Not folded into ci-web.yml (the shared reusable workflow every
  # tuxery/* repo's CI calls) — this needs a `wrangler dev` run, specific
  # to this repo. See playwright.worker.config.ts's header for what this
  # actually catches that the ci-web.yml `test` job (`pnpm run test`,
  # vitest) and e2e/ (runs against `pnpm dev`, not the real Worker bundle)
  # both miss.
  #
  # Points at catalog's own local `turso dev` server (see "Seed and serve
  # catalog" below) via `.dev.vars`, the same way local `pnpm serve`
  # (wrangler dev) does — not the hosted Turso preview DB: that shared DB's
  # publish pipeline broke 2026-09-04 (index-name collisions on republish,
  # see catalog's turso-client.ts) and was never fixed before its write
  # quota was separately exhausted, so every E2E run here inheriting a
  # blank/unreachable preview DB failed identically regardless of PR
  # content. A repo-committed, freshly-seeded local dataset has no quota
  # and no shared-state cross-PR contention — this job doesn't need a real
  # hosted DB at all, only something that speaks the same libSQL HTTP
  # protocol `catalog.ts` uses in prod.
  #
  # Deliberately no UNSPLASH_ACCESS_KEY here, unlike local `pnpm serve`'s
  # .dev.vars: the test only cares about catalog data, and every run spins
  # up a fresh `wrangler dev` — getHeroBackgroundPhoto()'s in-process cache
  # (unsplash.ts) never survives between runs, so a real key here would
  # mean burning one real Unsplash API call per CI run against the same
  # 50-req/hour demo-tier quota production shares with real visitors.
  # unsplash.ts already degrades to no background with no key set — that's
  # exactly what we want for this job.
  e2e-worker:
    name: E2E (Cloudflare Worker bundle)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Checkout catalog
        uses: actions/checkout@v7
        with:
          repository: tuxery/catalog
          path: catalog

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: catalog

      - name: Seed and serve catalog's local Turso dev server
        working-directory: catalog
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          # The installer drops sqld/turso in ~/.turso but only wires it
          # into ~/.bashrc — a non-interactive step never sources that, so
          # `turso dev` below fails with "sqld: executable file not found".
          echo "$HOME/.turso" >> "$GITHUB_PATH"
          export PATH="$HOME/.turso:$PATH"
          pnpm seed
          nohup pnpm serve > /tmp/catalog-serve.log 2>&1 &
          ready=""
          for _ in $(seq 1 30); do
            # A bare TCP connect only proves sqld accepted the socket, not
            # that it can actually answer a query yet — a real SELECT is
            # what the app's own first request needs to succeed too.
            if node -e "require('@libsql/client').createClient({url:'http://127.0.0.1:8080'}).execute('SELECT 1').then(()=>process.exit(0),()=>process.exit(1))" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            echo "::error::catalog's turso dev server never came up on :8080"
            cat /tmp/catalog-serve.log
            exit 1
          fi

      - name: Write .dev.vars for catalog's local dev server
        run: |
          cat > .dev.vars <<VARS
          TURSO_DB_URL=http://localhost:8080
          TURSO_DB_AUTH_TOKEN=local-dev
          VARS

      - name: Run worker e2e
        run: pnpm run test.e2e.worker -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-worker-report.json

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [[ -f e2e-worker-report.json ]]; then
            summary=$(jq -r '.stats | "\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' e2e-worker-report.json)
          else
            summary="no report"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  # e2e/'s own suite split into its two Playwright projects (see
  # playwright.config.ts) as two separate jobs — previously one "e2e" job
  # ran both, which meant a mobile-only failure showed as one bundled
  # "failing" row with no way to tell desktop and mobile apart from the PR
  # comment alone. Against `pnpm dev` (cheaper/faster than wrangler dev —
  # this suite doesn't need the real Worker bundle, e2e-worker/ already
  # covers that half), pointed at catalog's own local `turso dev` server
  # (see "Seed and serve catalog" below and e2e-worker's own comment for
  # why: the hosted Turso preview DB's publish pipeline is broken and its
  # write quota is exhausted). `vite.config.ts` already defaults
  # `TURSO_DB_URL` to `http://localhost:8080` whenever it's unset, so this
  # job doesn't even need to set it explicitly — just needs that local
  # server actually running first. No UNSPLASH_ACCESS_KEY, same reasoning
  # as e2e-worker above.
  e2e-desktop:
    name: E2E (desktop)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Checkout catalog
        uses: actions/checkout@v7
        with:
          repository: tuxery/catalog
          path: catalog

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: catalog

      - name: Seed and serve catalog's local Turso dev server
        working-directory: catalog
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          # The installer drops sqld/turso in ~/.turso but only wires it
          # into ~/.bashrc — a non-interactive step never sources that, so
          # `turso dev` below fails with "sqld: executable file not found".
          echo "$HOME/.turso" >> "$GITHUB_PATH"
          export PATH="$HOME/.turso:$PATH"
          pnpm seed
          nohup pnpm serve > /tmp/catalog-serve.log 2>&1 &
          ready=""
          for _ in $(seq 1 30); do
            # A bare TCP connect only proves sqld accepted the socket, not
            # that it can actually answer a query yet — a real SELECT is
            # what the app's own first request needs to succeed too.
            if node -e "require('@libsql/client').createClient({url:'http://127.0.0.1:8080'}).execute('SELECT 1').then(()=>process.exit(0),()=>process.exit(1))" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            echo "::error::catalog's turso dev server never came up on :8080"
            cat /tmp/catalog-serve.log
            exit 1
          fi

      - name: Run e2e (desktop)
        run: pnpm exec playwright test --project=chromium --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-desktop-report.json

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [[ -f e2e-desktop-report.json ]]; then
            summary=$(jq -r '.stats | "\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' e2e-desktop-report.json)
          else
            summary="no report"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  # Mobile half of the same suite (mobile-chromium project, mobile-*.spec.ts
  # files) — see e2e-desktop above for why this is a separate job rather
  # than one "e2e" job running both projects.
  e2e-mobile:
    name: E2E (mobile)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Checkout catalog
        uses: actions/checkout@v7
        with:
          repository: tuxery/catalog
          path: catalog

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: catalog

      - name: Seed and serve catalog's local Turso dev server
        working-directory: catalog
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          # The installer drops sqld/turso in ~/.turso but only wires it
          # into ~/.bashrc — a non-interactive step never sources that, so
          # `turso dev` below fails with "sqld: executable file not found".
          echo "$HOME/.turso" >> "$GITHUB_PATH"
          export PATH="$HOME/.turso:$PATH"
          pnpm seed
          nohup pnpm serve > /tmp/catalog-serve.log 2>&1 &
          ready=""
          for _ in $(seq 1 30); do
            # A bare TCP connect only proves sqld accepted the socket, not
            # that it can actually answer a query yet — a real SELECT is
            # what the app's own first request needs to succeed too.
            if node -e "require('@libsql/client').createClient({url:'http://127.0.0.1:8080'}).execute('SELECT 1').then(()=>process.exit(0),()=>process.exit(1))" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            echo "::error::catalog's turso dev server never came up on :8080"
            cat /tmp/catalog-serve.log
            exit 1
          fi

      - name: Run e2e (mobile)
        run: pnpm exec playwright test --project=mobile-chromium --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-mobile-report.json

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [[ -f e2e-mobile-report.json ]]; then
            summary=$(jq -r '.stats | "\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' e2e-mobile-report.json)
          else
            summary="no report"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  # e2e-degraded/'s suite (playwright.degraded.config.ts) — the one place
  # TURSO_DB_URL is deliberately unset, exercising the app's own no-DB
  # fallback UI. Never wired into any CI workflow before now. No secrets,
  # no preview DB — its own dev server on its own port, see that config's
  # header comment.
  e2e-degraded:
    name: E2E (degraded, no DB)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e (degraded)
        run: pnpm run test.e2e.degraded -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-degraded-report.json

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [[ -f e2e-degraded-report.json ]]; then
            summary=$(jq -r '.stats | "\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' e2e-degraded-report.json)
          else
            summary="no report"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  # One sticky comment (updates in place across pushes, not a new one
  # every run) summarizing every check in one place — GitHub's own PR
  # "Checks" tab scatters typecheck/lint/test/build/e2e-desktop/e2e-mobile/
  # e2e-worker/e2e-degraded across separate rows, easy to miss one failing
  # among the noise. Each row also carries its own pass/fail counts (from
  # ci-web.yml's test-summary output and each e2e job's own JSON-reporter
  # summary above) rather than just a status icon, so a failure is visible
  # at a glance without opening the job log.
  pr-comment:
    name: PR status comment
    needs: [ci, e2e-desktop, e2e-mobile, e2e-worker, e2e-degraded]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: helpers4/action/pr-status-comment@b93b7383e99665db30a61f16afce9fd6347bf4bf # main @ 2026-08-07
        with:
          comment-header: "CI"
          jobs: |
            {
              "🔎 TypeCheck": "${{ needs.ci.outputs.typecheck-result }}",
              "🧹 Lint": "${{ needs.ci.outputs.lint-result }}",
              "🧪 Unit Tests (${{ needs.ci.outputs.test-summary }})": "${{ needs.ci.outputs.test-result }}",
              "📦 Build": "${{ needs.ci.outputs.build-result }}",
              "🖥️ E2E Desktop (${{ needs.e2e-desktop.outputs.summary }})": "${{ needs.e2e-desktop.result }}",
              "📱 E2E Mobile (${{ needs.e2e-mobile.outputs.summary }})": "${{ needs.e2e-mobile.result }}",
              "🧭 E2E Worker bundle (${{ needs.e2e-worker.outputs.summary }})": "${{ needs.e2e-worker.result }}",
              "🛟 E2E Degraded (${{ needs.e2e-degraded.outputs.summary }})": "${{ needs.e2e-degraded.result }}"
            }
