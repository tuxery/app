name: Conventional Commits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Commit messages follow conventional commits + gitmoji
    # Dependabot's own commit messages never carry a gitmoji — it has no
    # way to know this repo's custom convention, so every dependency PR
    # failed this check regardless of content, found live on PR #37
    # (the first PR opened after dependabot.yml started grouping bumps).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The action does its own checkout (fetch-depth 0) by default; scopes
      # are auto-read from scopes.json at this repo's root.
      - uses: helpers4/action/conventional-commits@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          pr-comment: "none"
