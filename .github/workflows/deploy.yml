name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `closed` only runs the cleanup-preview job below.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  # Gates the deploy on the same checks ci.yml runs (typecheck/lint/test/
  # build) — deploy.yml used to be a fully independent workflow with no
  # `needs:` on it, so a commit that failed CI could still deploy straight
  # to preview (and, once merged, to production) as long as the build step
  # alone happened to succeed. Duplicated here rather than making `deploy`
  # depend on the separate `CI` workflow via `workflow_run`, since that
  # trigger runs on the base ref, not the PR's actual commit — `needs:` on
  # a job in the same workflow run is the only way to gate on the exact
  # commit being deployed.
  ci:
    if: github.event.action != 'closed'
    # Kept in lockstep with ci.yml's pin to the same reusable workflow — see
    # that file's comment: this was pinned to a feature-branch tip commit
    # that became unreachable once that branch's PR merged, breaking every
    # run (including deploys) since 2026-09-03. Re-pinned to main's head.
    uses: tuxery/.github/.github/workflows/ci-web.yml@a93f7e556b3778cdc3b23bff815b4bba650c7b47 # main @ 2026-09-04
    with:
      working-directory: .
      node-version: "26"

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    # Dependabot-triggered pull_request runs never get repo secrets
    # (GitHub withholds them from PRs opened by Dependabot, to stop a
    # malicious dependency bump from exfiltrating them) — wrangler-action
    # then fails outright on a missing CLOUDFLARE_API_TOKEN regardless of
    # the actual change, found live on PR #37. A human merging the
    # consolidated bump still gets a real deploy from the main-branch
    # push right after, with full secrets access.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.preview-url.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"
          working-directory: .

      - name: Build
        run: pnpm run build

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      # One Worker Preview per pull request, on tuxery-web itself, at
      # pr-<n>.preview.tuxery.store — it replaced the separate
      # tuxery-web-preview Worker (2026-10-19). Settings come from
      # wrangler.jsonc's `previews` block, secrets from the dashboard's
      # Previews Base config (preview-tuxery Turso DB, not prod's).
      # https://developers.cloudflare.com/workers/previews/examples/
      # `workflow_dispatch` on a branch names the Preview after the branch.
      - name: Compute preview name
        if: github.ref != 'refs/heads/main'
        id: preview-name
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            name="pr-${{ github.event.pull_request.number }}"
          else
            name=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        if: github.ref != 'refs/heads/main'
        id: preview-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "${{ steps.preview-name.outputs.name }}" --json)"
          printf '%s\n' "$output"
          # The JSON comes after pnpm's and wrangler's own progress lines on
          # stdout: take it from its opening brace (alone on its line) on.
          # No URL is not a failed deploy (the comment says so); it means no
          # Preview host is enabled yet (wrangler.jsonc's `preview_urls`).
          url="$(printf '%s\n' "$output" | sed -n '/^{$/,$p' | jq -r '.preview.urls[0] // .deployment.urls[0] // empty')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # A closed (merged or abandoned) pull request's Preview is deleted, so they
  # don't pile up against the 100-Previews-per-Worker limit (free plan).
  cleanup-preview:
    name: Delete preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"
          working-directory: .

      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # A pull request closed before its first successful deploy has no
        # Preview to delete; that's not a failure.
        run: pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation || echo "No preview to delete."

  # Cloudflare's own dashboard-driven Pages integration used to comment the
  # preview URL on every PR automatically — that stopped the moment
  # deploy.yml took over deploys (a GitHub Actions job has no equivalent
  # built in, wrangler-action included). Restores it as a sticky comment
  # (one comment that updates in place across pushes, not a new one every
  # run) instead of a plain echo, via helpers4's own reusable action.
  pr-comment:
    name: Preview URL comment
    needs: [ci, deploy]
    if: always() && github.event_name == 'pull_request' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: helpers4/action/pr-status-comment@b93b7383e99665db30a61f16afce9fd6347bf4bf # main @ 2026-08-07
        with:
          comment-header: "Preview Deployment"
          jobs: |
            {
              "🚀 Deploy preview": "${{ needs.deploy.result }}"
            }
          extra-markdown: |
            ${{ needs.deploy.outputs.preview-url && format('🔗 **Preview:** {0}', needs.deploy.outputs.preview-url) || '⚠️ No preview URL captured — check the `deploy` job logs.' }}
