name: Deploy — Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy apps/web
    runs-on: ubuntu-latest
    env:
      # GitHub Actions doesn't allow referencing `secrets` directly in an
      # `if:` conditional — route it through `env` first, then gate the
      # deploy step on `env.CLOUDFLARE_API_TOKEN` below.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"

      - name: Build (Cloudflare Pages adapter)
        working-directory: apps/web
        run: pnpm run build

      # No-ops until the CLOUDFLARE_API_TOKEN secret is configured on this
      # repository — see apps/web/README.md.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/web
        run: pnpm dlx wrangler pages deploy dist --project-name=tuxery
