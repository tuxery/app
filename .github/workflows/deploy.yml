name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gates the deploy on the same checks ci.yml runs (typecheck/lint/test/
  # build) — deploy.yml used to be a fully independent workflow with no
  # `needs:` on it, so a commit that failed CI could still deploy straight
  # to preview (and, once merged, to production) as long as the build step
  # alone happened to succeed. Duplicated here rather than making `deploy`
  # depend on the separate `CI` workflow via `workflow_run`, since that
  # trigger runs on the base ref, not the PR's actual commit — `needs:` on
  # a job in the same workflow run is the only way to gate on the exact
  # commit being deployed.
  ci:
    uses: tuxery/.github/.github/workflows/ci-web.yml@d31579f042cf78a25d34c729966ddf91f59c38be # main @ 2026-08-13
    with:
      working-directory: .

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.preview-url.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Build
        run: pnpm run build

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --env production

      # `versions upload` (not `deploy`) gives each branch its own stable,
      # non-clobbering Preview URL — https://developers.cloudflare.com/
      # workers/versions-and-deployments/preview-urls/#aliased-preview-urls
      # — rather than every branch overwriting the same 100%-traffic
      # deployment of tuxery-web-preview. `deploy` was used here originally
      # only because `versions upload` needs the Worker to already exist
      # (see 68af08c) — it does now. `github.head_ref` is the actual branch
      # name on a `pull_request` event (`github.ref` there is the synthetic
      # `refs/pull/<n>/merge`); `github.ref_name` covers `workflow_dispatch`
      # on a branch directly.
      - name: Compute preview alias from branch name
        if: github.ref != 'refs/heads/main'
        id: alias
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          alias=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')
          if [[ ! "$alias" =~ ^[a-z] ]]; then alias="b-$alias"; fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        if: github.ref != 'refs/heads/main'
        id: deploy-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --env preview --preview-alias ${{ steps.alias.outputs.alias }}

      # wrangler-action's own `deployment-url` output isn't reliable here —
      # `versions upload` prints two URLs (the version-hash one, then the
      # stable alias one) and wrangler-action's own extraction has
      # previously been observed picking "the first" without it being the
      # alias — so this parses the exact line straight out of wrangler's
      # own stdout instead of trusting that.
      - name: Extract preview alias URL
        if: github.ref != 'refs/heads/main'
        id: preview-url
        run: |
          url=$(echo "${{ steps.deploy-preview.outputs.command-output }}" | grep -oP '(?<=Version Preview Alias URL: ).*')
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Cloudflare's own dashboard-driven Pages integration used to comment the
  # preview URL on every PR automatically — that stopped the moment
  # deploy.yml took over deploys (a GitHub Actions job has no equivalent
  # built in, wrangler-action included). Restores it as a sticky comment
  # (one comment that updates in place across pushes, not a new one every
  # run) instead of a plain echo, via helpers4's own reusable action.
  pr-comment:
    name: Preview URL comment
    needs: [ci, deploy]
    if: always() && github.event_name == 'pull_request' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: helpers4/action/pr-status-comment@b93b7383e99665db30a61f16afce9fd6347bf4bf # main @ 2026-08-07
        with:
          comment-header: "Preview Deployment"
          jobs: |
            {
              "🚀 Deploy preview": "${{ needs.deploy.result }}"
            }
          extra-markdown: |
            ${{ needs.deploy.outputs.preview-url && format('🔗 **Preview:** {0}', needs.deploy.outputs.preview-url) || '⚠️ No preview URL captured — check the `deploy` job logs.' }}
