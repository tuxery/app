version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      qwik:
        patterns:
          - "@qwik.dev/*"
      # Everything else that isn't qwik itself or a dev dependency — before
      # this, daisyui/helpers4/@libsql/client/etc each got their own
      # individual PR (5 open at once, 2026-09), most of them small patch/
      # minor bumps that didn't need separate review cycles.
      production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@qwik.dev/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@qwik.dev/*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
