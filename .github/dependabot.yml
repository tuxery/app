version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # @cloudflare/workers-types ships a date-stamped version daily, and
    # wrangler/vitest release patches almost as often — without a cooldown,
    # each one retriggers a fresh grouped PR before the last one even closes
    # (e.g. dev-tooling PRs #43, #45, #47, #48 all within the same week).
    # Batches same-day/week noise into the next run instead.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      qwik:
        patterns:
          - "@builder.io/qwik*"
      # Everything else that isn't qwik itself or a dev dependency — before
      # this, daisyui/helpers4/@libsql/client/etc each got their own
      # individual PR (5 open at once, 2026-09), most of them small patch/
      # minor bumps that didn't need separate review cycles.
      production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@builder.io/qwik*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        # @builder.io/qwik's peer dependency caps vite at <8 (Qwik 2, which
        # lifts that cap, is still a 2.0.0-beta.x prerelease under a
        # different package name, @qwik.dev/core — not a drop-in bump).
        # Excluded so a blocked vite major doesn't hold back every other
        # harmless dev-tooling bump in the same group PR; these two get
        # their own individual PR instead, expected to stay unmergeable
        # until Qwik's peer range moves.
        exclude-patterns:
          - "vite"
          - "vite-tsconfig-paths"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
