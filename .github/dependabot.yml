version: 2

# One Dependabot pull request a week for the whole repository: npm and the
# GitHub Actions together (a multi-ecosystem group), instead of one per
# group and per ecosystem. Every update is reviewed and merged by hand, and
# four PRs on the same Monday were three too many.
#
# Titles and commits use the `deps` scope from scopes.json for every kind of
# dependency: Dependabot's own `include: scope` would write `deps-dev` for
# dev dependencies, which isn't a scope here.
#
# Bumping @qwik.dev/core also needs the `@builder.io/qwik` override in
# pnpm-workspace.yaml moved to the same version (two Qwik runtimes otherwise
# load together, Code(Q30)). Dependabot doesn't know that: the build fails
# on its PR until the override is updated on the branch.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "chore(deps)"
