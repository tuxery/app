version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      qwik:
        patterns:
          - "@builder.io/qwik*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
