allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - '@helpers4/array@3.1.1'
  - '@helpers4/ci@3.1.1'
  - '@helpers4/color@3.1.1'
  - '@helpers4/commit@3.1.1'
  - '@helpers4/date@3.1.1'
  - '@helpers4/function@3.1.1'
  - '@helpers4/guard@3.1.1'
  - '@helpers4/id@3.1.1'
  - '@helpers4/map@3.1.1'
  - '@helpers4/markdown@3.1.1'
  - '@helpers4/node@3.1.1'
  - '@helpers4/number@3.1.1'
  - '@helpers4/object@3.1.1'
  - '@helpers4/observable@3.1.1'
  - '@helpers4/promise@3.1.1'
  - '@helpers4/set@3.1.1'
  - '@helpers4/string@3.1.1'
  - '@helpers4/structure@3.1.1'
  - '@helpers4/type@3.1.1'
  - '@helpers4/url@3.1.1'
  - '@helpers4/version@3.1.1'
  - helpers4@3.1.1

# vite-imagetools (a qwik-city dependency, pinned to ^9.0.0 — the fix only
# landed in vite-imagetools@12) pulls a sharp version below the patched
# libvips CVE fixes. sharp's build is disabled above (unused here — this
# app doesn't use Qwik's <Image> transform), so forcing a patched version
# is a safe, low-risk way to clear `pnpm audit --audit-level high`.
overrides:
  sharp: ">=0.35.0"
