allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - '@helpers4/array@3.1.2'
  - '@helpers4/ci@3.1.2'
  - '@helpers4/color@3.1.2'
  - '@helpers4/commit@3.1.2'
  - '@helpers4/date@3.1.2'
  - '@helpers4/function@3.1.2'
  - '@helpers4/guard@3.1.2'
  - '@helpers4/id@3.1.2'
  - '@helpers4/license@3.1.2'
  - '@helpers4/map@3.1.2'
  - '@helpers4/markdown@3.1.2'
  - '@helpers4/node@3.1.2'
  - '@helpers4/number@3.1.2'
  - '@helpers4/object@3.1.2'
  - '@helpers4/observable@3.1.2'
  - '@helpers4/promise@3.1.2'
  - '@helpers4/set@3.1.2'
  - '@helpers4/string@3.1.2'
  - '@helpers4/structure@3.1.2'
  - '@helpers4/type@3.1.2'
  - '@helpers4/url@3.1.2'
  - '@helpers4/version@3.1.2'
  - helpers4@3.1.2

# vite-imagetools (a qwik-city dependency, pinned to ^9.0.0 — the fix only
# landed in vite-imagetools@12) pulls a sharp version below the patched
# libvips CVE fixes. sharp's build is disabled above (unused here — this
# app doesn't use Qwik's <Image> transform), so forcing a patched version
# is a safe, low-risk way to clear `pnpm audit --audit-level high`. Bumped
# again 2026-09-18: >=0.35.0 still included <0.35.4, which a separate
# libheif advisory (GHSA-g89c-p67h-r497/GHSA-2jg2-4ch7-h545) covers.
#
# svgo comes from @builder.io/qwik-city itself (its SSG/asset pipeline),
# not from any dependency this app controls directly — pinned above its
# vulnerable removeScripts range (GHSA-w27v-7q3p-w38r/GHSA-4vpr-x523-8j87)
# the same way.
overrides:
  sharp: ">=0.35.4"
  svgo: ">=3.3.5"
