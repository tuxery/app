name = "tuxery-web"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-14"

# TURSO_DB_URL / TURSO_DB_AUTH_TOKEN are not set here: local dev reads them
# from .dev.vars (gitignored, see .dev.vars.example), prod reads them from
# Cloudflare Pages' encrypted secrets. Neither belongs in a committed file —
# the auth token is a real credential, not project config.
